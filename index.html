<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bait Al Burger | Our Menu</title>

<link rel="icon" type="image/jpeg"
href="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Logo.jpeg">

<style>
:root{
    --gold:#E0CE00;
    --black:#000;
    --white:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:#fff;
    overflow-x:hidden;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:180px;
    max-width:100%;
    display:block;
    margin:auto;
    filter:drop-shadow(0 0 15px rgba(224,206,0,.25));
}

.page-title{
    text-align:center;
    color:var(--gold);
    font-size:38px;
    margin-bottom:25px;
    text-shadow:0 0 12px rgba(224,206,0,.35);
}

.back-btn,
.pdf-btn{
    display:block;
    max-width:280px;
    margin:0 auto 20px;
    text-align:center;
    padding:15px 25px;
    background:var(--gold);
    color:#000;
    text-decoration:none;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    transition:.3s ease;
    box-shadow:0 6px 18px rgba(224,206,0,.35);
}

.back-btn:hover,
.pdf-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(224,206,0,.45);
}

.menu-gallery{
    display:flex;
    flex-direction:column;
    gap:25px;
    margin-top:30px;
}

.menu-gallery img{
    width:100%;
    height:auto;
    display:block;
    border-radius:18px;

    /* HD & Sharp Display */
    image-rendering:auto;
    image-rendering:-webkit-optimize-contrast;

    filter:
        contrast(1.05)
        saturate(1.05)
        brightness(1.02);

    box-shadow:
        0 10px 30px rgba(255,255,255,.08),
        0 0 15px rgba(224,206,0,.08);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

    transform:translateZ(0);
    will-change:transform;
    background:#111;
}

.menu-gallery img:hover{
    transform:scale(1.01);
    box-shadow:
        0 15px 40px rgba(255,255,255,.12),
        0 0 20px rgba(224,206,0,.15);
}

.download-section{
    text-align:center;
    margin-top:50px;
}

.footer{
    margin-top:50px;
    padding-top:25px;
    border-top:1px solid rgba(255,255,255,.15);
    text-align:center;
    color:#999;
    font-size:14px;
}

@media (max-width:768px){

    .container{
        padding:15px;
    }

    .logo img{
        width:140px;
    }

    .page-title{
        font-size:30px;
    }

    .back-btn,
    .pdf-btn{
        width:100%;
        max-width:320px;
        font-size:16px;
        padding:14px;
    }

    .menu-gallery{
        gap:18px;
    }
}

@media (max-width:480px){

    .page-title{
        font-size:26px;
    }

    .menu-gallery img{
        border-radius:12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img
            src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Logo.jpeg"
            alt="Bait Al Burger Logo"
            loading="eager">
    </div>

    <h1 class="page-title">🍔 Our Menu</h1>

    <a href="https://baitalburger.pages.dev/" class="back-btn">
        ← Back to Home
    </a>

    <a href="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026.pdf"
       class="pdf-btn"
       target="_blank">
        📄 View Menu PDF
    </a>

    <div class="menu-gallery">

        <img
            src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_001-scaled.jpg"
            alt="Menu Page 1"
            loading="lazy"
            decoding="async">

        <img
            src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_002-scaled.jpg"
            alt="Menu Page 2"
            loading="lazy"
            decoding="async">

        <img
            src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_003-scaled.jpg"
            alt="Menu Page 3"
            loading="lazy"
            decoding="async">

        <img
            src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_004-scaled.jpg"
            alt="Menu Page 4"
            loading="lazy"
            decoding="async">

        <img
            src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_005-scaled.jpg"
            alt="Menu Page 5"
            loading="lazy"
            decoding="async">

        <img
            src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_006-scaled.jpg"
            alt="Menu Page 6"
            loading="lazy"
            decoding="async">

        <img
            src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_007-scaled.jpg"
            alt="Menu Page 7"
            loading="lazy"
            decoding="async">

        <img
            src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_008-scaled.jpg"
            alt="Menu Page 8"
            loading="lazy"
            decoding="async">

    </div>

    <div class="download-section">

        <a href="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026.pdf"
           class="pdf-btn"
           download="Bait-Al-Burger-Menu.pdf">
            📥 Download Menu PDF
        </a>

    </div>

    <div class="footer">
        © 2026 Bait Al Burger | Ras Al Khaimah, UAE
    </div>

</div>

</body>
</html>
