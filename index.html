<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bait Al Burger | Our Menu</title>

<link rel="icon" type="image/jpeg"
href="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Logo.jpeg">

<style>
:root{
    --gold:#E0CE00;
    --black:#000;
    --white:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.container{
    width:100%;
    max-width:900px;
    padding:40px 20px;
    text-align:center;
}

/* Logo section matches page background */

.logo{
    background:#000;
    padding:10px 0 25px;
}

.logo img{
    width:150px;
    max-width:100%;
    display:block;
    margin:auto;
    background:transparent;
    border:none;
    box-shadow:none;
    filter:drop-shadow(0 0 12px rgba(224,206,0,.25));
}

.page-title{
    color:var(--gold);
    font-size:38px;
    margin-bottom:35px;
    text-shadow:0 0 10px rgba(224,206,0,.35);
}

.back-btn,
.pdf-btn{
    display:block;
    max-width:320px;
    margin:0 auto 18px;
    padding:15px 20px;
    text-decoration:none;
    text-align:center;
    background:var(--gold);
    color:#000;
    font-size:18px;
    font-weight:700;
    border-radius:50px;
    transition:.3s ease;
    box-shadow:0 6px 18px rgba(224,206,0,.35);
}

.back-btn:hover,
.pdf-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(224,206,0,.45);
}

.download-section{
    margin-top:25px;
}

.footer{
    margin-top:60px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.15);
    color:#888;
    font-size:14px;
}

@media (max-width:768px){

    .container{
        padding:30px 15px;
    }

    .logo img{
        width:130px;
    }

    .page-title{
        font-size:30px;
    }

    .back-btn,
    .pdf-btn{
        width:100%;
        max-width:320px;
        font-size:16px;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="logo">
        <img
        src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Logo.jpeg"
        alt="Bait Al Burger Logo">
    </div>

    <h1 class="page-title">🍔 Our Menu</h1>

    <a href="https://baitalburger.pages.dev/" class="back-btn">
        ← Back to Home
    </a>

    <a href="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026.pdf"
       target="_blank"
       class="pdf-btn">
        📄 View Menu PDF
    </a>

    <div class="download-section">
        <a href="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026.pdf"
           download
           class="pdf-btn">
            📥 Download Menu PDF
        </a>
    </div>

    <div class="footer">
        © 2026 Bait Al Burger | Ras Al Khaimah, UAE
    </div>

</div>

</body>
</html>
