<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bait Al Burger | Our Menu</title>

<link rel="icon" type="image/jpeg"
href="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Logo.jpeg">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:180px;
    max-width:100%;
}

.page-title{
    text-align:center;
    color:#E0CE00;
    font-size:36px;
    margin-bottom:25px;
}

.back-btn{
    display:block;
    max-width:250px;
    margin:0 auto 35px;
    text-align:center;
    padding:15px;
    background:#E0CE00;
    color:#000;
    text-decoration:none;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.back-btn:hover{
    opacity:.9;
    transform:translateY(-2px);
}

.menu-gallery{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.menu-gallery img{
    width:100%;
    border-radius:15px;
    display:block;
    box-shadow:0 0 15px rgba(255,255,255,.12);
}

.footer{
    margin-top:40px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.15);
    text-align:center;
    color:#999;
    font-size:14px;
}

@media(max-width:768px){

    .logo img{
        width:140px;
    }

    .page-title{
        font-size:28px;
    }

    .back-btn{
        font-size:16px;
        padding:14px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Logo.jpeg"
             alt="Bait Al Burger">
    </div>

    <h1 class="page-title">🍔 Our Menu</h1>

    <a href="https://baitalburger.pages.dev/" class="back-btn">
        ← Back to Home
    </a>

    <div class="menu-gallery">

        <!-- Replace these URLs with your actual menu image URLs -->

        <img src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_001-scaled.jpg">

        <img src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_002-scaled.jpg">

        <img src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_003-scaled.jpg">

        <img src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_004-scaled.jpg">

        <img src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_005-scaled.jpg">

        <img src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_006-scaled.jpg">

        <img src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_007-scaled.jpg">

        <img src="https://ainglobaltech.com/wp-content/uploads/2026/11/Bait-Al-Burger-Menu-Card-New_Updated-on-21-11-2026_008-scaled.jpg">

    </div>

    <div class="footer">
        © 2026 Bait Al Burger | Ras Al Khaimah, UAE
    </div>

</div>

</body>
</html>
